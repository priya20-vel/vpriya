server.port=8080
spring.application.name=ai-resume-screening-system

# Debug and logging settings
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Error handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.whitelabel.enabled=false

# H2 Database settings
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# JWT settings - Extended for longer sessions
jwt.secret=aiResumeScreeningSecretKey2024SecureKeyForJWT256Bits
jwt.expiration=604800000

# File upload settings - Enhanced for very large files
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=5MB
server.tomcat.max-http-post-size=100MB
server.tomcat.connection-timeout=60000
server.tomcat.max-threads=300

# CORS settings - Fixed: Use specific origins instead of "*" when allowCredentials is true
spring.web.cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://127.0.0.1:8080
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
