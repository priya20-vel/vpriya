    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f8ff; /* Light blue background */

        }

        h1 {
            text-align: center;
            font-size: 2.5em;

        }

        h2 {
            text-align: center;
            font-size: 1.5em;

        ol {
            max-width: 600px;
            margin: 0 auto;
            padding: 0;
            list-style: none;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        li {
            margin: 15px 0;
        }

        .button {
            display: inline-block;
            background-color: #ff4500; /* OrangeRed for buttons */
            color: white;
            padding: 15px 20px;
            border-radius: 5px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            transition: background-color 0.3s, transform 0.2s;
        }

        .button:hover {
            background-color: #dc143c; /* Crimson on hover */
            transform: translateY(-3px);
        }
